id: li2016_t2d_fbg_reproduction_v3
frozen_on: '2026-10-13'
query: (TITLE_ABS:("type 2 diabetes" OR T2DM OR "type II diabetes") OR KW:"Diabetes
  Mellitus, Type 2") AND (TITLE_ABS:(probiotic* OR synbiotic* OR lactobacill* OR bifidobacter*
  OR saccharomyces OR yeast OR streptococc* OR enterococc* OR "gut microbiota" OR
  "intestinal microbia" OR yogurt OR yoghurt) OR KW:Probiotics) AND FIRST_PDATE:[1900-01-01
  TO 2016-04-12] AND SRC:MED
eligibility: Human randomized controlled trials in people with type 2 diabetes, published
  by 2016-04-12, full English article. Interventions are probiotic agents, synbiotic
  products or nutritional brewer yeast (including inactivated Saccharomyces); controls
  may be placebo, conventional matched food, no active supplement or dietary advice.
  This operational reconstruction follows the published included intervention/comparator
  scope, which is broader than its stated placebo/probiotic-only criteria. Exclude
  other diabetes types, nonrandomized and animal studies. Extract unadjusted fasting
  blood glucose endpoint means and dispersions at end of treatment; no change-score
  SMD. Estimate the microbial/synbiotic/yeast intervention effect without unmatched
  additional nonmicrobial active co-interventions. Additional glucose-lowering foods,
  herbs, drugs, or fortified active nutrients must be balanced between the selected
  arms. In a multiarm trial, extract a unique eligible intervention/comparator pair
  when other arms fail these criteria. Do not combine eligible arms or select among
  multiple equally eligible pairs without a separately specified dependence method.
outcome: FBG
unit: dimensionless
allowed_source_units:
- mmol/L
- mg/dL
value_type: endpoint
measure: SMD
model: random
timing_rule: end of treatment
dependence_rule: One independent parallel comparison per trial. Select a unique eligible
  unconfounded pair from a multiarm trial; unresolved multiple eligible pairs and
  crossover trials remain excluded from pooling.
dispersion_policy: within_arm_se_to_sd_v1
evaluation_scope: Post-hoc development reproduction; primary-source extraction separated
  from reference targets
method_sources:
- https://pmc.ncbi.nlm.nih.gov/articles/PMC4937966/
- https://pmc.ncbi.nlm.nih.gov/articles/PMC4763470/
eligibility_contract: Observed review inclusion reconstruction; divergence from stated
  placebo-only/live-probiotic methods explicitly audited
search_date_note: Published search terms broadened through yeast synonyms; accessible
  MED implementation cannot recreate EMBASE/Cochrane or historical index snapshots.
search_implementation: Title/abstract and MeSH/publisher keyword bibliographic fields,
  not default Europe PMC fulltext searching. Translated accessible MED query; not
  a reconstruction of unavailable EMBASE/Cochrane searches.
validate_query_fields: true
version_note: v3 clarifies the eligible contrast in factorial/multiarm trials, based
  on the review question of a probiotic agent and primary randomized intervention
  descriptions. It does not change the search or numerical target.
