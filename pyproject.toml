[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-systematic-review"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "pyarrow>=15",
  "pydantic>=2.6",
  "jsonschema>=4.21",
  "requests>=2.31",
  "PyYAML>=6.0",
  "rich>=13.7",
  "pdfplumber>=0.11",
  "beautifulsoup4>=4.12,<5",
  "pypdf>=4.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["scripts"]
